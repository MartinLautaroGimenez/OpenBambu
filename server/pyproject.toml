[project]
name = "openbambu"
version = "0.1.0"
description = "Servidor de control para impresoras Bambu Lab (A1/P1) en red local"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "aiomqtt>=2.3",
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2.7",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
openbambu = "openbambu.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openbambu*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
