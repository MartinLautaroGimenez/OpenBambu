name: Build

on:
  push:
    branches: ["**"]
    paths: ["app/**", "server/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk OpenBambu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBambu-apk
          path: app/OpenBambu.apk
      # Publica el APK como pre-release para descargarlo directo desde el celular
      - name: Publicar pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="apk-${BRANCH//\//-}"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" OpenBambu.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "OpenBambu APK ($BRANCH)" \
            --notes "Compilación automática de \`$BRANCH\` ($GITHUB_SHA). Descargá OpenBambu.apk desde el celular e instalalo."
