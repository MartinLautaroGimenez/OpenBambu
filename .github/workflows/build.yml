name: Build

on:
  push:
    branches: ["**"]
    paths: ["app/**", "server/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Construye la imagen Docker con OrcaSlicer y lamina un cubo con los perfiles de la A1
  slicer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64  # Raspberry Pi 4/5
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagen (${{ matrix.platform }})
        run: docker build -t openbambu:test server
      - name: Autotest del laminador
        run: docker run --rm openbambu:test python3 -m openbambu.slicer.selftest
      - name: Autotest A1 mini
        run: docker run --rm openbambu:test python3 -m openbambu.slicer.selftest A1MINI

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk OpenBambu.apk
      # Dashboard web: la misma app compilada para navegador (la sirve el servidor)
      - name: Compilar dashboard web
        run: |
          flutter build web --release --base-href /
          (cd build/web && zip -qr ../../OpenBambu-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBambu-apk
          path: |
            app/OpenBambu.apk
            app/OpenBambu-web.zip
      # Publica el APK como pre-release para descargarlo directo desde el celular
      - name: Publicar pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="apk-${BRANCH//\//-}"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" OpenBambu.apk OpenBambu-web.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "OpenBambu APK ($BRANCH)" \
            --notes "Compilación automática de \`$BRANCH\` ($GITHUB_SHA). Descargá OpenBambu.apk desde el celular e instalalo."
